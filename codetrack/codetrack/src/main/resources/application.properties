spring.application.name=codetrack
server.port=${PORT:8080}

# ---- PostgreSQL (default). Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codetrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT. ALWAYS set JWT_SECRET (32+ chars) outside local development.
app.jwt.secret=${JWT_SECRET:codetrack-local-dev-secret-change-me-0123456789}
app.jwt.expiration-ms=86400000

# ---- Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ---- Platform sync
app.sync.on-link=true
app.sync.cron=0 0 3 * * *
# Optional GitHub token for higher API rate limits
app.github.token=${GITHUB_TOKEN:}
